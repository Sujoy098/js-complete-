<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator Clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Calculator Clone</h1>
    <div class="calculator">
        <div class="display">
            <div class="expression"></div>
            <div class="result">0</div>
        </div>
        <div class="button-row">
            <button class="clear">AC</button>
            <button class="sign">+/-</button>
            <button class="precent">%</button>
            <button class="operator">/</button>
         </div>
         <div class="button-row">
            <button class="number">7</button>
            <button class="number">8</button>
            <button class="number">9</button>
            <button class="operator">*</button>
         </div>
         <div class="button-row">
            <button class="number">4</button>
            <button class="number">5</button>
            <button class="number">6</button>
            <button class="operator">-</button>
         </div>
         <div class="button-row">
            <button class="number">1</button>
            <button class="number">2</button>
            <button class="number">3</button>
            <button class="operator">+</button>
         </div>
         <div class="button-row">
            <button class="number zero">0</button>
            <button class="number">.</button>
            <button class="number">=</button>
            <!-- <button class="operator">+</button> -->
         </div>

    </div>
    <script >
      
const expression = document.querySelector('.expression');
const result = document.querySelector('.result');
const clearButton = document.querySelector('.clear');
const signButton = document.querySelector('.sign');
const percentButton = document.querySelector('.percent');
const operatorButton = document.querySelector('.operator');
const numberButton = document.querySelector('.number');

let currentValue ='0';
let operator = null;
let previousValue = null;

function updateDisplay(){
    result.textContent = currentValue;
}

function clear(){
    currentValue ='0';
     operator = null;
     previousValue = null;
     updateDisplay();
}

function toggleSign(){
    currentValue = String(Number(currentValue)* -1);
    updateDisplay();
}

function convertToPercent(){
    currentValue = String(Number(currentValue)/100);
    updateDisplay();
}

function handleOperatorClick(value){
    if(operator !== null){
        performOperator();
    }else{
        previousValue = currentValue;
    }

    if(previousValue === null){
        previousValue = currentValue;
    }

    operator = value;
    if(operator !== "="){
        expression.textContent = `${previousValue} ${operator}`
    }else{
        expression.textContent = `${previousValue}`;
    }

    currentValue = '0';
}

 function performOperator(){
    switch(operator){
        case '+' :
             currentValue =String(Number(previousValue) / numberButton(currentValue));
             break;

        case '*' :
             currentValue =String(Number(previousValue) * numberButton(currentValue));
             break;
             
        case '-' :
            currentValue =String(Number(previousValue) - numberButton(currentValue));
             break;

        case '+' :
            currentValue =String(Number(previousValue) + numberButton(currentValue));
             break;

        default :
        return ;
    }

    operator = null;
    previousValue = null;
    expression.textContent = `${currentValue}`;
    updateDisplay();
 }


function handleNumberClick(button){
    if(currentValue === '0' && button.textContent !== '.'){
        currentValue = button.textContent;
    }else if (button.textContent ==='.'  && currentValue.includes('.')){
        return;
    }else{
        currentValue += button.textContent;
    }

    updateDisplay();
}

operatorButtons.forEach(button => {
    button.addEvenListener('click',()  => {
        handleOperatorClick(button.textContent);
    });
    
});

numberButtons.forEach(button => {
    button.addEvenListener('click', () => {
        handleNumberClick(button);

    });
})

clearButton.addEventListener('click', clear);
signButton.addEventListener('click', toggleSign);
percentButton.addEventListener('click',convertToPercent);

    </script>
</body>
</html>
